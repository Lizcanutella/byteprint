[project]
name = "byteprint"
version = "0.1.0"
description = "BYTEPRINT — robust detection of AI-generated images under real-world transformations"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
byteprint = "byteprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["byteprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:byteprint.*",
    # joblib 1.x still assigns to ndarray.shape, deprecated in numpy 2.5. Third-party.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
